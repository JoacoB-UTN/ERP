name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: "22"
  # Dummy/test-only values — never real secrets. See AGENTS.md/docs/development-workflow.md.
  DATABASE_URL: "postgresql://erp:erp@localhost:5432/erp_platform_test?schema=public"
  REDIS_URL: "redis://localhost:6379"
  CORS_ORIGIN: "http://localhost:3000,http://localhost:3002"
  AUTH_ACCESS_TOKEN_SECRET: "ci-test-only-access-secret-not-a-real-secret"
  AUTH_COOKIE_SECURE: "false"
  SEED_ADMIN_EMAIL: "admin@example.local"
  SEED_ADMIN_PASSWORD: "ci-test-only-password-not-a-real-secret"
  NEXT_PUBLIC_API_URL: "http://localhost:3001/api/v1"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
          POSTGRES_DB: erp_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api

      - name: Apply migrations
        run: npm run db:migrate:deploy --workspace=apps/api

      - name: Seed (verifies the seed script runs cleanly against a fresh database)
        run: npm run db:seed

      - name: Unit tests
        run: npm test

      - name: E2E tests
        run: npm run test:e2e

  build:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api

      - name: Build API
        run: npm run build:api

      - name: Build Gestión
        run: npm run build:gestion

      - name: Build Facturación
        run: npm run build:facturacion
