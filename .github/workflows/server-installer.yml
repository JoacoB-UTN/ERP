name: ERP Server installer

# The payload is what actually breaks — a missing build output, a Next
# standalone tree without its static assets, a path that only exists on the
# developer's machine. Building it on every relevant change catches that
# without needing a Windows VM. Compiling the .exe is a separate, manual job:
# it only makes sense for a release, and a real install still has to be tested
# on a clean machine (see docs/server-installer.md).

on:
  pull_request:
    paths:
      - 'infrastructure/windows/**'
      - 'apps/server-agent/**'
      - 'apps/api/prisma/provision.ts'
      - 'apps/api/prisma/system-roles.ts'
      - 'apps/*/next.config.ts'
      - '.github/workflows/server-installer.yml'
  workflow_dispatch:
    inputs:
      compile_installer:
        description: 'Also compile the .exe with Inno Setup'
        type: boolean
        default: false

env:
  NODE_VERSION: '22'
  # The major the product is developed and tested against. Bundling a
  # different one would ship customers a database engine no CI run ever
  # exercised, and would leave the backup agent's pg_dump on a different
  # major than the cluster it dumps.
  POSTGRES_MAJOR: '16'
  # The EXACT build that ships. Not "some 16.x": a customer's cluster, the
  # backup agent's pg_dump and every CI run have to be the same binaries, and
  # "whatever the runner happens to have" is none of those. Bump deliberately,
  # together with POSTGRES_SHA256 below.
  POSTGRES_VERSION: '16.10-1'
  # SHA-256 of the .zip named by POSTGRES_VERSION, so a build cannot bundle a
  # binary nobody vouched for. An unset value does not silently pass: the
  # Stage PostgreSQL step prints the digest it computed and REFUSES to compile
  # a release installer, so the value below is filled in once, from a run that
  # shows it, and reviewed like any other pinned dependency.
  POSTGRES_SHA256: ''
  # Dummy/test-only values — never real secrets. Needed because `next build`
  # and `prisma generate` read the environment.
  DATABASE_URL: 'postgresql://erp:erp@localhost:5432/erp_platform_test?schema=public'
  REDIS_URL: 'redis://localhost:6379'
  AUTH_ACCESS_TOKEN_SECRET: 'ci-test-only-access-secret-not-a-real-secret'

jobs:
  payload:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate --workspace=apps/api

      - name: Stage PostgreSQL
        id: postgres
        shell: pwsh
        # A payload without PostgreSQL produces an installer whose
        # `erp-postgres` service has nothing to run — the machine ends up with
        # five services and no database. That was the state of every .exe CI
        # produced until now, and it is the reason none of them could be
        # installed. See docs/server-installer.md.
        #
        # This runs on every payload build, not only at release: the payload
        # job exists to be run on a clean runner and find what a developer
        # machine hides, and PostgreSQL staging is exactly that kind of step.
        # Exercising it only at release would mean discovering a broken
        # download the day we cut one.
        run: |
          $version  = "${{ env.POSTGRES_VERSION }}"
          $major    = "${{ env.POSTGRES_MAJOR }}"
          $expected = "${{ env.POSTGRES_SHA256 }}".Trim().ToLowerInvariant()
          $release  = "${{ inputs.compile_installer }}" -eq 'true'

          # The runner's own PostgreSQL is deliberately NOT used, whatever
          # major it happens to be. It is an unpinned, unverifiable build that
          # changes when GitHub changes its image, and it would make the
          # bundled database differ between two runs of the same commit.
          $url  = "https://get.enterprisedb.com/postgresql/postgresql-$version-windows-x64-binaries.zip"
          $zip  = Join-Path $env:RUNNER_TEMP 'pgsql.zip'
          $dest = Join-Path $env:RUNNER_TEMP 'pgsql-download'

          Write-Host "Downloading pinned PostgreSQL $version"
          try {
            Invoke-WebRequest -Uri $url -OutFile $zip -UseBasicParsing
          } catch {
            Write-Host "::error::Could not download PostgreSQL from $url -- $($_.Exception.Message). Bump POSTGRES_VERSION (and POSTGRES_SHA256) to a build EnterpriseDB still publishes."
            exit 1
          }

          $actual = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Write-Host "SHA-256 of postgresql-$version-windows-x64-binaries.zip:"
          Write-Host "  $actual"

          if ($expected) {
            if ($actual -ne $expected) {
              Write-Host "::error::PostgreSQL checksum mismatch. Expected $expected, got $actual. Either the pinned digest is stale or the download was tampered with; do not bundle this."
              exit 1
            }
            Write-Host 'Checksum matches the pinned value.'
          } elseif ($release) {
            Write-Host "::error::POSTGRES_SHA256 is not set, so this download is unverified and must not go into a release installer. Set POSTGRES_SHA256 to $actual in .github/workflows/server-installer.yml and re-run."
            exit 1
          } else {
            Write-Host "::warning::POSTGRES_SHA256 is not set: the download was NOT verified. Paste $actual into POSTGRES_SHA256 to pin it. Release builds (compile_installer=true) refuse to run without it."
          }

          Expand-Archive -Path $zip -DestinationPath $dest -Force
          $binDir = Join-Path $dest 'pgsql\bin'

          if (-not (Test-Path (Join-Path $binDir 'initdb.exe'))) {
            Write-Host "::error::The downloaded archive has no initdb.exe under pgsql\bin: $binDir"
            exit 1
          }

          # Recorded so the payload, the job summary and a support call all
          # say the same thing about which database was shipped.
          $provenance = @(
            "version=$version"
            "sha256=$actual"
            "verified=$([bool]$expected)"
            "source=$url"
          )
          $provenanceFile = Join-Path $env:RUNNER_TEMP 'POSTGRES-SOURCE.txt'
          Set-Content -Path $provenanceFile -Value $provenance -Encoding utf8

          Add-Content -Path $env:GITHUB_OUTPUT -Value "dir=$binDir" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "version=$version" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "sha256=$actual" -Encoding utf8
          Add-Content -Path $env:GITHUB_OUTPUT -Value "provenance=$provenanceFile" -Encoding utf8

          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Bundled PostgreSQL`n`n- version: ``$version```n- sha256: ``$actual```n- checksum pinned: $([bool]$expected)" -Encoding utf8

      - name: Build payload
        shell: pwsh
        run: ./infrastructure/windows/build-payload.ps1 -Build -PostgresDir '${{ steps.postgres.outputs.dir }}'

      - name: Record which PostgreSQL was bundled
        shell: pwsh
        # Travels with the payload so the installed machine can say what it is
        # running, and install.ps1 prints it during validation. A support call
        # about "the database" starts from a version and a digest instead of a
        # guess.
        run: |
          Copy-Item -Path '${{ steps.postgres.outputs.provenance }}' `
                    -Destination 'dist/erp-server/pgsql/POSTGRES-SOURCE.txt' -Force
          Get-Content 'dist/erp-server/pgsql/POSTGRES-SOURCE.txt'

      - name: Verify payload contents
        shell: pwsh
        # Guards the two failure modes that produce a payload which looks fine
        # and is broken: a missing entry point, and Next standalone output
        # without the static assets it does not copy itself.
        run: |
          $payload = 'dist/erp-server'
          $required = @(
            "$payload/node/node.exe",
            "$payload/winsw/WinSW.exe",
            "$payload/winsw/LICENSE.txt",
            "$payload/server/apps/api/dist/main.js",
            "$payload/server/apps/server-agent/dist/main.js",
            "$payload/server/apps/api/prisma/schema.prisma",
            "$payload/server/apps/api/prisma/provision.js",
            "$payload/server/apps/api/src/generated/prisma/client.js",
            "$payload/server/node_modules/@erp/shared/dist/index.js",
            "$payload/server/node_modules/@erp/config/dist/index.js",
            "$payload/gestion/apps/gestion/server.js",
            "$payload/gestion/apps/gestion/.next/static",
            "$payload/facturacion/apps/facturacion/server.js",
            "$payload/facturacion/apps/facturacion/.next/static",
            "$payload/services/erp-api.xml.template",
            "$payload/scripts/install.ps1",
            "$payload/scripts/uninstall.ps1",
            "$payload/VERSION",
            # Without these the erp-postgres service has nothing to run and
            # the backup agent has no pg_dump — an installer that gets all
            # the way to "installed" and then has no database.
            "$payload/pgsql/bin/initdb.exe",
            "$payload/pgsql/bin/pg_ctl.exe",
            "$payload/pgsql/bin/postgres.exe",
            "$payload/pgsql/bin/pg_dump.exe",
            "$payload/pgsql/bin/pg_restore.exe",
            # The smoke test below connects with it; listed so a future
            # pruning change fails here rather than inside that step.
            "$payload/pgsql/bin/psql.exe",
            "$payload/pgsql/POSTGRES-SOURCE.txt"
          )
          $missing = $required | Where-Object { -not (Test-Path $_) }
          if ($missing) {
            Write-Error "Missing from payload:`n$($missing -join "`n")"
            exit 1
          }

          # Staging the wrong major would install a database engine no CI run
          # ever exercised, and leave the agent's pg_dump on a different major
          # than the cluster. Cheap to check, expensive to discover later.
          $major = "${{ env.POSTGRES_MAJOR }}"
          $v = (& "$payload/pgsql/bin/initdb.exe" --version 2>&1 | Out-String).Trim()
          if ($v -notmatch "\s$major\.") {
            Write-Error "Payload bundles the wrong PostgreSQL: '$v', expected $major.x"
            exit 1
          }
          Write-Host "Payload contents OK. Bundled $v"

      - name: Smoke-test the bundled PostgreSQL
        shell: pwsh
        # Until now the only thing proving the bundled database worked was
        # `initdb --version`, which shows the binary loads its DLLs and
        # nothing more. It says nothing about whether a cluster can be
        # CREATED — which is the question the payload pruning actually puts
        # at risk, since `share/` holds the templates initdb reads and `lib/`
        # the libraries the server loads.
        #
        # So: initdb, start, connect, query, stop, using the payload's own
        # binaries and nothing else on the runner. Not a substitute for
        # installing on a clean Windows VM — no service account, no Service
        # Control Manager, no ACLs — but it moves "can this engine run at
        # all" from untested to tested on every payload build.
        run: |
          $pgBin = Resolve-Path 'dist/erp-server/pgsql/bin'
          $data  = Join-Path $env:RUNNER_TEMP 'pgsmoke-data'
          $log   = Join-Path $env:RUNNER_TEMP 'pgsmoke.log'
          $port  = 55432
          $pw    = Join-Path $env:RUNNER_TEMP 'pgsmoke-pw.txt'
          Set-Content -Path $pw -Value 'smoke-only-not-a-secret' -Encoding ascii -NoNewline

          Write-Host '--- initdb ---'
          & "$pgBin/initdb.exe" --pgdata=$data --username=erp --pwfile=$pw `
              --encoding=UTF8 --locale=C --auth-local=scram-sha-256 --auth-host=scram-sha-256
          if ($LASTEXITCODE -ne 0) { throw "initdb failed ($LASTEXITCODE): the bundled PostgreSQL cannot create a cluster." }

          try {
            Write-Host '--- pg_ctl start ---'
            & "$pgBin/pg_ctl.exe" -D $data -l $log -o "-p $port -c listen_addresses=127.0.0.1" -w start
            if ($LASTEXITCODE -ne 0) {
              if (Test-Path $log) { Get-Content $log }
              throw "pg_ctl start failed ($LASTEXITCODE): the bundled PostgreSQL will not start."
            }

            Write-Host '--- connect and query ---'
            $env:PGPASSWORD = 'smoke-only-not-a-secret'
            $out = & "$pgBin/psql.exe" -h 127.0.0.1 -p $port -U erp -d postgres -tAc `
                   "SELECT current_setting('server_version') || ' ok'"
            if ($LASTEXITCODE -ne 0) { throw "psql could not query the cluster ($LASTEXITCODE)." }
            $out = ($out | Out-String).Trim()
            Write-Host "    $out"
            if ($out -notmatch '^16\.') { throw "The running cluster reports '$out', expected 16.x." }

            # pg_dump is what the backup agent runs; proving it works against
            # this cluster is the other half of "the database is usable".
            Write-Host '--- pg_dump ---'
            $dump = Join-Path $env:RUNNER_TEMP 'pgsmoke.dump'
            & "$pgBin/pg_dump.exe" -h 127.0.0.1 -p $port -U erp -d postgres -Fc -f $dump
            if ($LASTEXITCODE -ne 0) { throw "pg_dump failed ($LASTEXITCODE)." }
            if (-not (Test-Path $dump)) { throw 'pg_dump reported success but wrote no file.' }
            Write-Host "    dump written: $((Get-Item $dump).Length) bytes"
          } finally {
            Write-Host '--- pg_ctl stop ---'
            & "$pgBin/pg_ctl.exe" -D $data -m fast -w stop
            Remove-Item $pw -Force -ErrorAction SilentlyContinue
            $env:PGPASSWORD = $null
          }
          Write-Host 'Bundled PostgreSQL initialised, started, served a query, dumped and stopped.'

      - name: Check the payload carries no secrets
        shell: pwsh
        # The templates must still contain placeholders, never rendered values:
        # a payload with a real secret in it would ship that secret to every
        # customer who installs the same build.
        run: |
          Get-ChildItem 'dist/erp-server/services' -Filter '*.xml' |
            ForEach-Object { Write-Error "Rendered service definition in payload: $($_.Name)"; exit 1 }
          Write-Host 'No rendered service definitions in the payload.'

      - name: Validate service definitions
        shell: pwsh
        # Renders each template the way install.ps1 does and has the real WinSW
        # binary parse the result. This is the ONLY automated coverage the
        # service definitions get, and it earns its keep: it caught a literal
        # "{{" + "PLACEHOLDER}}" string inside a template comment, which
        # install.ps1's own unreplaced-placeholder guard matched — that alone
        # would have aborted every single installation.
        run: |
          $payload = 'dist/erp-server'
          $winsw = Resolve-Path "$payload/winsw/WinSW.exe"
          $work = Join-Path $env:RUNNER_TEMP 'svcvalidate'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          New-Item -ItemType Directory -Path (Join-Path $work 'logs') -Force | Out-Null

          # Dummy values only — never real secrets. The '&' exercises the XML
          # escaping a generated password can require.
          $r = @{
            '{{PG_PORT}}' = '5433'; '{{API_PORT}}' = '3001'
            '{{GESTION_PORT}}' = '3000'; '{{FACTURACION_PORT}}' = '3002'
            '{{DATABASE_URL}}' = 'postgresql://erp:p&amp;ss@127.0.0.1:5433/erp?schema=public'
            '{{REDIS_URL}}' = 'redis://127.0.0.1:6379'
            '{{CORS_ORIGIN}}' = 'http://localhost:3000,http://localhost:3002'
            '{{AUTH_ACCESS_TOKEN_SECRET}}' = 'ci-only-not-a-real-secret'
            '{{ERP_BACKUP_DIR}}' = 'C:\ERP\backups'
            '{{ERP_PG_BIN_DIR}}' = 'C:\ERP\pgsql\bin'
            '{{ERP_BACKUP_TIMES}}' = '03:00'
            '{{ERP_BACKUP_RETENTION_DAYS}}' = '30'
            '{{ERP_BACKUP_KEEP_MINIMUM}}' = '7'
            '{{ERP_BACKUP_CLOUD_ENABLED}}' = 'false'
            '{{CLOUD_ENV_BLOCK}}' = ''
          }

          $failed = $false
          foreach ($id in @('erp-postgres','erp-api','erp-gestion','erp-facturacion','erp-agent')) {
            $c = Get-Content "$payload/services/$id.xml.template" -Raw
            foreach ($k in $r.Keys) { $c = $c.Replace($k, $r[$k]) }

            if ($c -match '\{\{[A-Z_]+\}\}') {
              Write-Host "::error::$id : unreplaced placeholder $($Matches[0])"
              $failed = $true; continue
            }

            Set-Content -Path (Join-Path $work "$id.xml") -Value $c -Encoding utf8
            $exe = Join-Path $work "$id.exe"
            Copy-Item $winsw $exe -Force
            $out = (& $exe status 2>&1 | Out-String).Trim()
            if ($out -match 'FATAL|Exception') {
              Write-Host "::error::$id : WinSW rejected the configuration -- $out"
              $failed = $true
            } else {
              Write-Host "$id : OK ($out)"
            }
          }
          if ($failed) { exit 1 }

      - name: Compile installer
        if: ${{ inputs.compile_installer }}
        shell: pwsh
        run: |
          # Inno Setup is not guaranteed to be on the runner image, so install
          # it rather than assuming.
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            choco install innosetup --no-progress -y
          }
          $version = Get-Content dist/erp-server/VERSION
          # Inno resolves a relative Source: against the .iss file's own
          # directory, not the working directory, so a repo-root-relative
          # payload path silently becomes infrastructure/windows/dist/... and
          # the compile aborts with "No files found matching". Pass it absolute.
          $payloadDir = (Resolve-Path dist/erp-server).Path
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" `
            infrastructure/windows/erp-server.iss `
            /DPayloadDir=$payloadDir /DAppVersion=$version

      - name: Upload installer
        if: ${{ inputs.compile_installer }}
        uses: actions/upload-artifact@v4
        with:
          name: erp-server-installer
          path: infrastructure/windows/Output/*.exe
          if-no-files-found: error
