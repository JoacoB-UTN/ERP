name: Desktop package (Windows)

# Focused, opt-in workflow — see docs/desktop-lan-architecture.md's
# "Windows package". Deliberately NOT part of ci.yml: a plain
# backend/frontend PR should never pay the cost of downloading Electron
# and building a Windows installer. Runs on demand, and automatically
# only for PRs that actually touch the desktop client itself.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "apps/desktop/**"
      - ".github/workflows/desktop-package.yml"

env:
  NODE_VERSION: "22"

jobs:
  package-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint apps/desktop
        run: npm run lint --workspace=apps/desktop

      - name: Typecheck apps/desktop
        run: npm run typecheck --workspace=apps/desktop

      - name: Test apps/desktop
        run: npm run test --workspace=apps/desktop

      - name: Build apps/desktop
        run: npm run build:desktop

      - name: Package Windows x64 installer
        run: npm run package:desktop

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: erp-client-windows-x64
          path: apps/desktop/release/*.exe
          if-no-files-found: error
